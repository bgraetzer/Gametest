<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Tetris</h1>
        <p>Use arrow keys to move, up to rotate, space to hard drop.</p>
      </header>
      <main>
        <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>
        <aside class="panel">
          <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Lines</span>
            <strong id="lines">0</strong>
          </div>
          <div class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
          <button id="start">Start / Restart</button>
        </aside>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
